# ── Split Role ─────────────────────────────────────────────────
# Right half is the central — connects to host via USB or Bluetooth
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ── OLED Sleep Fix ─────────────────────────────────────────────
# Deep sleep prevents the SSD1306 from reinitializing on wake.
# Disable it here; the display will blank on idle instead.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_KEYBOARD_NAME="Corne (Right)"

# Blank the display after 30 seconds of inactivity (gentle power save)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=30000

# ── RGB LEDs (right half only) ─────────────────────────────────
# Corne v3: 21x SK6812MINI-E (per-key) + 6x WS2812B (underglow) = 27 total
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Default effect: breathe (0=solid, 1=breathe, 2=spectrum, 3=swirl)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=1

# Start color: white hue, low brightness
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20

# AUTO_OFF_IDLE disabled — with CONFIG_ZMK_SLEEP=n there is no proper wake
# event to restore LEDs, so they would stay dark until manually toggled.
# The display still blanks at idle via CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n